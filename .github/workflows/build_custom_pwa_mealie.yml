name: Build Mealie (custom pwa theme)

on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:

env:
  IMAGE_NAME: custom-pwa-mealie
  THEME_COLOR: "DDBF86"

jobs:
  check:
    name: Check for image update
    runs-on: ubuntu-latest
    outputs:
      update_image: ${{ steps.set_output.outputs.update }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest Mealie release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/mealie-recipes/mealie/releases/latest \
            | jq -r '.tag_name')
          echo "LATEST=$LATEST" >> $GITHUB_ENV

      - name: Read last built version
        run: |
          LAST=$(cat LAST_BUILT_VERSION)
          echo "LAST=$LAST" >> $GITHUB_ENV

      - name: Skip if no new version
        id: set_output
        if: env.LATEST == env.LAST
        run: |
          echo "No new Mealie release. Skipping build."
          echo "::set-output name=update::false"
          exit 0

  build:
    name: Build new image
    needs: [check]
    if: needs.check.outputs.update_image != 'false'
    runs-on: ubuntu-latest

    steps:

      - name: Clone Mealie and patch color
        run: |
          git clone https://github.com/mealie-recipes/mealie.git
          cd mealie
          git checkout $LATEST
          sed -i -E "s/E58325/$THEME_COLOR/" ./frontend/nuxt.config.ts

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        run: |
          cd mealie
          cp docker/Dockerfile .
          docker build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$LATEST \
            -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest \
            .
          docker push --all-tags ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME

      - name: Store built version
        run: |
          echo "$LATEST" > LAST_BUILT_VERSION
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add LAST_BUILT_VERSION
          git commit -m "Built custom pwa Mealie $LATEST"
          git push
